# 各サイトのリポジトリの .claude/site-ops.yml に置く設定。
# このファイルはテンプレート。中身は対象サイトごとに書き換える。

# 表示名。レポートの見出しに使う
name: "サイトA"

# GA4 プロパティID。GA4 管理画面 > プロパティ設定 の数字を "properties/" 付きで
ga4_property_id: "properties/123456789"

# Search Console のプロパティ。登録されている表記と完全一致させる
#   ドメインプロパティ: "sc-domain:example.com"
#   URLプレフィックス : "https://example.com/"
gsc_site_url: "sc-domain:example.com"

# サイトの前提。数値だけでは打ち手が決まらないため、ここが判断の質を左右する。
# 何のサイトか / 誰が使うか / 何を成果とみなすか / 触ってはいけない領域があるか、を書く。
context: |
  ◯◯を目的とした個人開発のツールサイト。
  主な利用者は△△。成果とみなすのは□□。
  収益化はしておらず、流入の絶対数より特定機能の利用継続を重視する。

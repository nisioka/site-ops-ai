# サイト設定テンプレート。
# このファイルをコピーして sites/<任意のID>.yml を作る(例: sites/site-a.yml)。
# 先頭が _ のファイルはテンプレ扱いで実行対象から除外される。

# 表示名(レポート/Issue タイトルに使われる)
name: "サイトA"

# GA4 プロパティID。GA4 管理画面 > プロパティ設定 で確認できる数字を "properties/" 付きで。
ga4_property_id: "properties/123456789"

# Search Console のプロパティ。
#   ドメインプロパティ: "sc-domain:example.com"
#   URLプレフィックス : "https://example.com/"
gsc_site_url: "sc-domain:example.com"

# 重点KPI(自由記述)。AI 分析プロンプトへのヒントとして渡る。
focus_kpi:
  - "オーガニックセッション"
  - "問い合わせCV"

# 検知の閾値。サイトの規模・変動幅に合わせて調整する。
thresholds:
  traffic_drop_pct: 30 # セッション低下率(%)がこれ以上で検知
  ctr_drop_pct: 20 # 検索クリック低下率(%)
  rank_drop: 3 # 平均掲載順位の悪化(位)
  min_impressions: 100 # これ未満の表示回数は無視(ノイズ抑制)
  low_ctr_pct: 1.0 # 高表示なのに CTR がこれ未満なら「改善余地」

# 提案の出力先
output:
  type: github_issue # github_issue | markdown
  repo: "nisioka/site-a" # type=github_issue のとき "owner/name"
  labels:
    - "seo"
    - "ai-proposal"
  assignees: []
